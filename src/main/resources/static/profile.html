<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/header.js" defer></script>
    <script>
        const savedTheme = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

<app-header type="back" title="Profile" back="/index.html"></app-header>

<div class="container-sm">
    <div class="avatar-big" id="avatar-big">?</div>
    <div class="profile-username" id="profile-username"></div>
    <div class="profile-role" id="profile-role"></div>

    <hr class="divider">

    <p class="msg-success" id="success">Saved successfully!</p>
    <p class="msg-error" id="error">Something went wrong.</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="your@email.com">
    <button class="btn btn-primary" onclick="saveEmail()">Save Email</button>

    <hr class="divider">

    <label>New Password</label>
    <input type="password" id="new-password" placeholder="New password">

    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Confirm password">
    <button class="btn btn-primary" onclick="savePassword()">Save Password</button>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const username = localStorage.getItem('username');
    const role = localStorage.getItem('role');

    document.getElementById('avatar-big').textContent = username ? username[0].toUpperCase() : '?';
    document.getElementById('profile-username').textContent = username;
    document.getElementById('profile-role').textContent = role
        ? role.replace('ROLE_', '').charAt(0) + role.replace('ROLE_', '').slice(1).toLowerCase()
        : '';

    async function loadProfile() {
        const res = await fetch('/api/auth/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
            const user = await res.json();
            document.getElementById('email').value = user.email || '';
        }
    }

    async function saveEmail() {
        const email = document.getElementById('email').value;
        const res = await fetch('/api/auth/profile/email', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ email })
        });
        showMessage(res.ok);
    }

    async function savePassword() {
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
            document.getElementById('error').textContent = 'Passwords do not match!';
            document.getElementById('error').style.display = 'block';
            document.getElementById('success').style.display = 'none';
            return;
        }

        const res = await fetch('/api/auth/profile/password', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ password: newPassword })
        });
        showMessage(res.ok);
    }

    function showMessage(ok) {
        document.getElementById('success').style.display = ok ? 'block' : 'none';
        document.getElementById('error').style.display = ok ? 'none' : 'block';
    }

    loadProfile();
</script>
</body>
</html>
