<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/header.js" defer></script>
    <script>
        const savedTheme = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

<app-header type="back" title="Add Product" back="/index.html" id="page-header"></app-header>

<div class="container-md">
    <img id="image-preview" class="image-preview">

    <label>Name *</label>
    <input type="text" id="name" placeholder="Product name">

    <label>Category *</label>
    <input type="text" id="category" placeholder="Category">

    <label>Price *</label>
    <input type="number" id="price" placeholder="0.00" step="0.01">

    <label>Quantity *</label>
    <input type="number" id="quantity" placeholder="0">

    <label>Supplier</label>
    <input type="text" id="supplier" placeholder="Supplier name">

    <label>Image URL</label>
    <input type="text" id="imageUrl" placeholder="https://..." oninput="previewImage()">

    <label>Description</label>
    <textarea id="description" placeholder="Product description..."></textarea>

    <button class="btn btn-primary" onclick="save()">Save</button>
</div>

<script>
    const role = localStorage.getItem('role');
    if (!role || role === 'ROLE_CUSTOMER') window.location.href = '/index.html';

    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (id) {
        fetch(`/api/products/${id}`)
            .then(res => res.json())
            .then(p => {
                document.getElementById('name').value = p.name;
                document.getElementById('category').value = p.category;
                document.getElementById('price').value = p.price;
                document.getElementById('quantity').value = p.quantity;
                document.getElementById('supplier').value = p.supplier || '';
                document.getElementById('imageUrl').value = p.imageUrl || '';
                document.getElementById('description').value = p.description || '';
                previewImage();
            });
    }

    function previewImage() {
        const url = document.getElementById('imageUrl').value;
        const preview = document.getElementById('image-preview');
        preview.src = url;
        preview.style.display = url ? 'block' : 'none';
    }

    async function save() {
        const product = {
            name: document.getElementById('name').value,
            category: document.getElementById('category').value,
            price: parseFloat(document.getElementById('price').value),
            quantity: parseInt(document.getElementById('quantity').value),
            supplier: document.getElementById('supplier').value,
            imageUrl: document.getElementById('imageUrl').value,
            description: document.getElementById('description').value
        };

        const url = id ? `/api/products/${id}` : '/api/products';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(product)
        });

        if (res.ok) {
            window.location.href = '/index.html';
        } else {
            alert('Error saving product. Check all required fields.');
        }
    }
</script>
</body>
</html>
