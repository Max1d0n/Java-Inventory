<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/header.js" defer></script>
    <script>
        const savedTheme = localStorage.getItem('theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

<app-header type="main" title="Inventory"></app-header>

<div class="products-grid" id="products"></div>

<button class="fab" id="add-btn" onclick="window.location.href='/add.html'">+</button>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const role = localStorage.getItem('role');
    const addBtn = document.getElementById('add-btn');
    if (!role || role === 'ROLE_CUSTOMER') {
        addBtn.classList.add('disabled');
        addBtn.onclick = null;
    }

    async function loadProducts() {
        const res = await fetch('/api/products');
        const products = await res.json();
        const container = document.getElementById('products');

        if (products.length === 0) {
            container.innerHTML = '<p style="padding:24px;color:#888">No products yet. Add one!</p>';
            return;
        }

        products.forEach(product => {
            container.innerHTML += `
                <div class="product-card" onclick="window.location.href='/product.html?id=${product.id}'">
                    ${product.imageUrl
                ? `<img src="${product.imageUrl}" alt="${product.name}">`
                : `<div class="no-image">📦</div>`
            }
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="price">$${product.price}</div>
                        <div class="quantity">In stock: ${product.quantity}</div>
                    </div>
                </div>
            `;
        });
    }

    loadProducts();
</script>
</body>
</html>
